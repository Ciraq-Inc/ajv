name: Test coverage

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests and collect coverage
        run: npm run test:coverage
      - name: Verify Nuxt server API routes
        run: npm run test:server-api
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ajv-coverage
          path: coverage/
          if-no-files-found: ignore
